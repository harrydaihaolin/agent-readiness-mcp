[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "agent-readiness-mcp"
version = "0.7.0"
description = "MCP server exposing agent-readiness scan, detect, and apply tools to coding agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Harry Dai" }]
keywords = ["mcp", "agents", "agent-readiness", "claude", "cursor"]
dependencies = [
    # 2.5.0 is the engine release that ships the workspace_detect
    # module + the detect_v1 envelope. detect_workspace and
    # scan_workspace import directly from that module; scan_repo
    # surfaces its structured `multi_repo_workspace` error.
    # 3.0.4+ adds the `live_scan` package, `render` module, and the
    # `scan-and-view`/`scan-status`/`scan-stop`/`scan-list`/`render-report`
    # CLI commands that the live-scan tools wrap.
    # 3.4.0+ adds the Bundle D live-dashboard surface (events.jsonl +
    # prompts.jsonl + SSE/JSON endpoints on the scan-and-view server)
    # that get_scan_status's sse_url / snapshot_url / prompts_pending_count
    # / mode_exit_requested fields expose to coding agents.
    "agent-readiness>=3.4.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
# Ontology passthrough is a soft extra so the base wheel installs even
# when ``agent-readiness-ontology-mcp`` is not yet on PyPI. The
# ontology() function lazy-imports it at call time and surfaces a clean
# ImportError if the extra wasn't installed.
ontology = [
    "agent-readiness-ontology-mcp>=0.1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
agent-readiness-mcp = "agent_readiness_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_readiness_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"
