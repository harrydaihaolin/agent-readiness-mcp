[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "agent-readiness-mcp"
version = "0.9.0"
description = "Headless, prompt-only MCP server exposing agent-readiness inspect, scan, and apply tools to coding agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Harry Dai" }]
keywords = ["mcp", "agents", "agent-readiness", "claude", "cursor"]
dependencies = [
    # The server is headless and prompt-only: every scan returns its
    # report inline (no dashboard / live-scan subprocess). It uses the
    # engine's in-process scoring API (context / rules_eval /
    # rules_runtime / scorer) plus workspace_detect, enumerate, and
    # workspace_scan, and the `inspect` CLI for the fast pre-flight.
    "agent-readiness>=4.1.0,<5.0.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
# Ontology passthrough is a soft extra so the base wheel installs even
# when ``agent-readiness-ontology-mcp`` is not yet on PyPI. The
# ontology() function lazy-imports it at call time and surfaces a clean
# ImportError if the extra wasn't installed.
ontology = [
    "agent-readiness-ontology-mcp>=0.1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
agent-readiness-mcp = "agent_readiness_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_readiness_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"
