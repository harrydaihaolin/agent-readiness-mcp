[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "agent-readiness-mcp"
version = "0.1.0"
description = "MCP server exposing agent-readiness scan_repo and apply_top_action tools to coding agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Harry Dai" }]
keywords = ["mcp", "agents", "agent-readiness", "claude", "cursor"]
dependencies = [
    "agent-readiness>=2.3.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
agent-readiness-mcp = "agent_readiness_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_readiness_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"
