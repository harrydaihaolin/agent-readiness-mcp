name: Release

# Publishes agent-readiness-mcp to PyPI on a v* tag.
# Mirrors agent-readiness/.github/workflows/release.yml; keep these in
# sync when the contract changes.
#
# Trusted publishing (PyPI OIDC) is the auth mechanism: no API token
# secret. The PyPI project must have a "pending publisher" registered
# pointing at:
#
#   owner:        harrydaihaolin
#   repository:   agent-readiness-mcp
#   workflow:     release.yml
#   environment:  pypi
#
# Set this up at https://pypi.org/manage/account/publishing/ before
# tagging the first release.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pin to v6

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # pin to v6
        with:
          python-version: "3.12"

      - name: Install build
        run: pip install build

      - name: Build wheel and sdist
        run: python -m build

      - name: Verify dist contents
        run: ls -lh dist/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # pin to v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/agent-readiness-mcp
    permissions:
      id-token: write   # Required for OIDC trusted publishing

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # pin to v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # pin to release/v1
        with:
          skip-existing: true   # idempotent: safe to re-run if tag is re-pushed

  github-release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pin to v6

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # pin to v8
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # pin to v3
        with:
          generate_release_notes: true
          files: dist/*

  smoke-pypi:
    name: Smoke-test published wheel
    needs: publish-pypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # pin to v6
        with:
          python-version: "3.12"
      - name: Wait for PyPI to surface the new release
        run: sleep 30
      - name: Install published wheel by exact tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VER="${TAG#v}"
          for attempt in 1 2 3 4 5 6; do
            if pip install --no-cache-dir "agent-readiness-mcp==${VER}"; then
              echo "Installed agent-readiness-mcp==${VER} on attempt ${attempt}"; exit 0
            fi
            echo "PyPI does not yet have ${VER}, retrying in 20s..."; sleep 20
          done
          echo "::error::Could not install agent-readiness-mcp==${VER} after 6 attempts"
          exit 1
      - name: Verify --version + import smoke
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VER="${TAG#v}"
          python3 -c "
          import agent_readiness_mcp as m
          assert m.__version__ == '${VER}', (m.__version__, '${VER}')
          # The server module imports lazily so we don't accidentally
          # boot the MCP stdio loop here. Just confirm the exposed
          # tool functions are importable.
          from agent_readiness_mcp.server import scan_repo, list_friction
          print('import OK; version', m.__version__)
          "
